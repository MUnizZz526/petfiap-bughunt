spring.application.name=petfiap

# ==========================================
# Oracle Database Config (FIAP) - como nas Aulas 12 e 13
# >>> TROQUE SEU_RM e SUA_SENHA pelas credenciais do grupo antes de rodar <<<
# (Necessario apenas para RODAR a API. Os testes unitarios nao usam banco.)
# ==========================================
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=SEU_RM
spring.datasource.password=SUA_SENHA

# JPA/Hibernate (o Hibernate detecta o dialect do banco automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mostrar SQL formatado no console
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# H2 em memoria (opcional - para testar sem o Oracle da FIAP)
# Para usar: comente o bloco Oracle acima e descomente o bloco abaixo
# Console do banco: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:petfiap | User: sa | Password: (vazio)
